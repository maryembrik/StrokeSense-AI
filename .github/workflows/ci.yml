name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt pytest==9.2.0
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8501/_stcore/health
      - run: docker compose run --rm monitor python -m src.monitor_job --once
      - if: failure()
        run: docker compose logs
